<html lang="en">
<head>

<body>
    <div id="imageGallery">
        <img src="C:\Users\Admin\OneDrive\Pictures\Camera Roll\finance and investment analyst.png" alt="Image 1" class="gallery-image active" width="200" height="150">
        <img src="C:\Users\Admin\OneDrive\Pictures\Camera Roll\data analysis and economics.png" alt="Image 2" class="gallery-image" width="200" height="150">
        <img src="C:\Users\Admin\OneDrive\Pictures\Camera Roll\web developer.png" alt="Image 3" class="gallery-image" width="200" height="150">
        <button id="prevBtn">Previous</button>
        <button id="nextBtn">Next</button>
      </div>
    <script src="script.js">
        const images = document.querySelectorAll('.gallery-image');
const prevButton = document.getElementById('prevBtn');
const nextButton = document.getElementById('nextBtn');
let currentIndex = 0;

function showImage(index) {
  images.forEach((img, i) => {
    img.classList.remove('active');
    if (i === index) {
      img.classList.add('active');
    }
  });
}

function nextImage() {
  currentIndex = (currentIndex + 1) % images.length;
  showImage(currentIndex);
}

function prevImage() {
  currentIndex = (currentIndex - 1 + images.length) % images.length;
  showImage(currentIndex);
}

nextButton.addEventListener('click', nextImage);
prevButton.addEventListener('click', prevImage);

showImage(currentIndex); // Show the initial image


// Tab functionality
const tabButtons = document.querySelectorAll('.tab-button');
const tabContents = document.querySelectorAll('.tab-content');

tabButtons.forEach(button => {
  button.addEventListener('click', () => {
    const tabId = button.dataset.tab;

    // Deactivate all buttons and content
    tabButtons.forEach(btn => btn.classList.remove('active'));
    tabContents.forEach(content => content.classList.remove('active'));

    // Activate the clicked button and corresponding content
    button.classList.add('active');
    document.getElementById(tabId).classList.add('active');
  });
});


// Form validation
const form = document.getElementById('myForm');
const nameInput = document.getElementById('name');
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const nameError = document.getElementById('nameError');
const emailError = document.getElementById('emailError');
const passwordError = document.getElementById('passwordError');

form.addEventListener('submit', (event) => {
  let isValid = true;

  // Required field check
  if (!nameInput.value.trim()) {
    nameError.textContent = 'Name is required';
    isValid = false;
  } else {
    nameError.textContent = '';
  }

  // Email format validation
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (emailInput.value && !emailRegex.test(emailInput.value)) {
    emailError.textContent = 'Invalid email format';
    isValid = false;
  } else {
    emailError.textContent = '';
  }

  // Password rules
  if (passwordInput.value.length < 8) {
    passwordError.textContent = 'Password must be at least 8 characters';
    isValid = false;
  } else {
    passwordError.textContent = '';
  }

  if (!isValid) {
    event.preventDefault(); // Prevent form submission if validation fails
  }
});

// Bonus: Real-time feedback
nameInput.addEventListener('input', () => {
  if (!nameInput.value.trim()) {
    nameError.textContent = 'Name is required';
  } else {
    nameError.textContent = '';
  }
});

emailInput.addEventListener('input', () => {
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (emailInput.value && !emailRegex.test(emailInput.value)) {
    emailError.textContent = 'Invalid email format';
  } else {
    emailError.textContent = '';
  }
});

passwordInput.addEventListener('input', () => {
  if (passwordInput.value.length < 8) {
    passwordError.textContent = 'Password must be at least 8 characters';
  } else {
    passwordError.textContent = '';
  }
});

//interactive image gallery
const changeButton = document.getElementById('changeButton');
const targetElement = document.getElementById('target');

changeButton.addEventListener('click', () => {
  if (targetElement.textContent === 'Hello') {
    targetElement.textContent = 'Goodbye!';
    targetElement.style.color = 'red';
  } else {
    targetElement.textContent = 'Hello';
    targetElement.style.color = 'green';
  }
});
    </script>

<div class="tabs">
    <div class="tab-buttons">
      <button class="tab-button active" data-tab="tab1">Tab 1</button>
      <button class="tab-button" data-tab="tab2">Tab 2</button>
      <button class="tab-button" data-tab="tab3">Tab 3</button>

    <div class="tab-contents">
      <div id="tab1" class="tab-content active">Content for Tab 1</div>
      <div id="tab2" class="tab-content">Content for Tab 2</div>
      <div id="tab3" class="tab-content">Content for Tab 3</div>
    </div>
  </div>

  <form id="myForm">
    <div>
      <label for="name">Name (required):</label>
      <input type="text" id="name" required>
      <span class="error-message" id="nameError"></span>
    
      <label for="email">Email:</label>
      <input type="email" id="email">

  </form>
